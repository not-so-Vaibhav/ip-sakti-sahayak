version: "3.8"

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: ip_sakti_qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:

# Usage:
#   docker compose up -d
#   Qdrant dashboard: http://localhost:6333/dashboard
#
# Supabase is a managed cloud service (or local instance).
# Create a free project at https://supabase.com, then run schema_mvp.sql
# in its SQL editor. Put the connection string in your .env.
